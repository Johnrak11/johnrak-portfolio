name: Build and Deploy Portfolio

# The image is built HERE and pulled by the droplet. Previously deploy.sh ran
# `pull || true` and then always rebuilt, so every deploy compiled the SPA on
# a 1 GB host that is also running MariaDB and php-fpm.

on:
  push:
    branches: ["prod"]
  workflow_dispatch:

# GHCR requires a fully lowercase image reference, so the owner is written out
# rather than taken from github.repository_owner ("Johnrak11").
env:
  IMAGE: ghcr.io/johnrak11/johnrak-portfolio

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails the run early rather than shipping a build where the sync
      # silently no-ops because the variable was empty.
      - name: Check the API token is configured
        run: |
          if [ -z "${{ vars.VITE_PORTFOLIO_API_TOKEN }}" ]; then
            echo "::error::Repository variable VITE_PORTFOLIO_API_TOKEN is not set."
            echo "::error::Add it under Settings > Secrets and variables > Actions > Variables,"
            echo "::error::using a token from the admin panel's Security & Tokens page."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NOTE: Vite inlines these into the public JS bundle, and build args
          # are also visible in `docker history`. Only values safe to publish
          # belong here — which is why the token is a repository *variable*, not
          # a secret: a secret cannot be read back, so drift between it and the
          # admin's api_clients table would be invisible instead of diagnosable.
          build-args: |
            VITE_ADMIN_API_BASE_URL=${{ vars.VITE_ADMIN_API_BASE_URL || 'https://admin.johnrak.online' }}
            VITE_PORTFOLIO_API_TOKEN=${{ vars.VITE_PORTFOLIO_API_TOKEN }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/projects/johnrak-portfolio
            git fetch origin prod
            git reset --hard origin/prod
            chmod +x deploy.sh
            IMAGE_TAG=${{ github.sha }} ./deploy.sh
