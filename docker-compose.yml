# =============================================================
#  johnrak-portfolio — static SPA behind the shared edge proxy.
#
#  No domain, no certificate volumes, no ACME email: the infra
#  repo terminates TLS and routes by hostname.
# =============================================================

services:
  web:
    profiles: ["prod"]
    container_name: portfolio-web
    # Built and pushed by CI. `build` remains as a fallback for local work
    # and for BUILD_LOCALLY=1 ./deploy.sh
    image: ghcr.io/${GHCR_IMAGE:-johnrak11/johnrak-portfolio}:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        VITE_ADMIN_API_BASE_URL: ${VITE_ADMIN_API_BASE_URL}
        VITE_PORTFOLIO_API_TOKEN: ${VITE_PORTFOLIO_API_TOKEN}
    expose:
      - "80"
    networks:
      - edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

networks:
  edge:
    name: infra_edge
    external: true

volumes:
  node_modules:
